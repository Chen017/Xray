name: Main

on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: get ver
        run: |
          echo "$(cat xray.sh | grep ver=)" >> $GITHUB_ENV
          echo "old=$(git tag | tail -n1)" >> $GITHUB_ENV
      # - name: test
      #   if: env.is_sh_ver == env.old 
      #   run: |
      #     echo not found new version.
      #     exit 1
      - name: zip
        run: zip -9vr code.zip . -x .\*
      - name: release
        uses: softprops/action-gh-release@v1
        with:
          files: code.zip
          tag_name: ${{ env.is_sh_ver }}
      - name: cleanup old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有 release 的 tag，按创建时间降序排列，跳过最新 3 个，删除其余
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read tag; do
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
