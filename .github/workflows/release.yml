name: Validate and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck unzip
      - name: Bash syntax and ShellCheck errors
        run: |
          find . -name '*.sh' -not -path './.test-tools/*' -print0 | xargs -0 -n1 bash -n
          find . -name '*.sh' -not -path './.test-tools/*' -print0 | xargs -0 shellcheck -S error
      - name: Fetch official runtimes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tests/fetch_tools.py
      - name: Isolated regression against pinned and current Xray
        run: |
          for binary in .test-tools/v*/xray; do
            XRAY_TEST_BIN="$PWD/$binary" MIHOMO_TEST_BIN="$PWD/.test-tools/mihomo" bash tests/regression.sh
          done

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish a new version only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^is_sh_ver=\(v[0-9][0-9.]*\)$/\1/p' xray.sh)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release list --limit 1000 --json tagName > /tmp/xray-releases.json
          if jq -e --arg version "$version" 'any(.[]; .tagName == $version)' /tmp/xray-releases.json >/dev/null; then
            echo "$version already published; skip."
            exit 0
          fi
          zip -9r code.zip install.sh xray.sh update_geodata.sh src README.md image.png
          gh release create "$version" code.zip --target "$GITHUB_SHA" --title "$version" --generate-notes
      - name: Retain three releases and preserve Git tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 1000 --json tagName,createdAt,isDraft,isPrerelease \
            --jq 'map(select(.isDraft == false and .isPrerelease == false)) | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while IFS= read -r tag; do
                gh release delete "$tag" --yes
              done